<!DOCTYPE html>
<html>
<head>
    <title>Logo Inspect</title>
    <style>
        body { background: #ccc; }
        .grid-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 316px; height: 273px;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, rgba(255,0,0,0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,0,0,0.5) 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>
</head>
<body>
    <div style="position: relative; width: 316px; height: 273px;">
        <img id="logo" src="" alt="logo">
        <div class="grid-overlay"></div>
    </div>
    <script>
        fetch('../images/logo-transparent.svg')
            .then(r => r.text())
            .then(text => {
                const b64 = text.split('base64,')[1].split('"')[0];
                document.getElementById('logo').src = 'data:image/png;base64,' + b64;
            });
    </script>
</body>
</html>
